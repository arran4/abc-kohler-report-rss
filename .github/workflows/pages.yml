name: Deploy RSS and Markdown to GitHub Pages

on:
  schedule:
    # 8:30 PM AEST is 10:30 AM UTC
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build site directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public/rss
          # Generate index.html from readme.md using a Go-based markdown to HTML converter
          gh release download -R arran4/fork-mdtohtml -p "*linux_amd64.tar.gz" -O - | tar xvz -C /tmp
          /tmp/mdtohtml readme.md
          echo '<!DOCTYPE html><html><head><title>ABC Kohler Report RSS</title></head>' > public/index.html
          cat readme.html >> public/index.html
          echo '</html>' >> public/index.html
          # Generate RSS feed
          go run ./cmd/abckohlerreportrss -output public/rss/abckohlerreportrss.xml

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'
          name: github-pages-${{ github.run_attempt }}


  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
